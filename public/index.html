<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style id="ldcss">
#ld{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;background:linear-gradient(135deg,#f6fdf9,#d9f2e4 48%,#bde8d1);transition:opacity .9s ease,transform .9s ease,filter .9s ease}
#ld.out{opacity:0;transform:scale(1.07);filter:blur(10px);pointer-events:none}
#ld .ld-bg{position:absolute;inset:0;overflow:hidden}
#ld .ld-bg::before,#ld .ld-bg::after{content:"";position:absolute;width:90vmax;height:90vmax;border-radius:50%;left:-25vmax;top:55%;background:radial-gradient(closest-side,#9be5bf88,#9be5bf00);animation:ldw 9s ease-in-out infinite alternate}
#ld .ld-bg::after{left:auto;right:-30vmax;top:-45%;background:radial-gradient(closest-side,#ffe3a888,#ffe3a800);animation-duration:12s}
@keyframes ldw{to{transform:translate(6vmax,-4vmax) scale(1.12)}}
#ld .ld-bg i{position:absolute;top:-8%;width:12px;height:18px;border-radius:70% 0 70% 0;background:linear-gradient(160deg,#ffd6e6,#f29bbd);opacity:0;animation:ldp 7s linear infinite}
#ld .ld-bg i:nth-child(1){left:12%;animation-delay:.2s}#ld .ld-bg i:nth-child(2){left:27%;animation-delay:1.6s;width:9px;height:14px}
#ld .ld-bg i:nth-child(3){left:44%;animation-delay:.9s}#ld .ld-bg i:nth-child(4){left:61%;animation-delay:2.4s;width:10px;height:15px}
#ld .ld-bg i:nth-child(5){left:76%;animation-delay:.5s}#ld .ld-bg i:nth-child(6){left:90%;animation-delay:1.9s;width:9px;height:14px}
@keyframes ldp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(-9vw,112vh) rotate(420deg);opacity:.6}}
#ld .ld-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
#ld .ld-sp{width:clamp(110px,22vh,190px);height:auto;overflow:visible;filter:drop-shadow(0 8px 10px #0a3a2a33)}
#ld .ld-stem{stroke-dasharray:110;stroke-dashoffset:110;animation:ldd 1.1s .15s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes ldd{to{stroke-dashoffset:0}}
#ld .ld-lf{transform:scale(0);animation:ldl .7s cubic-bezier(.2,1.3,.4,1) forwards}
#ld .ld-lf.a{transform-origin:60px 96px;animation-delay:.75s}#ld .ld-lf.b{transform-origin:60px 82px;animation-delay:.95s}
@keyframes ldl{to{transform:scale(1)}}
#ld .ld-fl{transform-origin:60px 40px;transform:scale(0) rotate(-90deg);animation:ldf .9s 1.25s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes ldf{to{transform:scale(1) rotate(0)}}
#ld .ld-t{margin:4px 0 0;font-weight:500;font-size:clamp(26px,5.4vh,48px);letter-spacing:.28em;padding-left:.28em;display:flex;color:#1f4a35}
#ld .ld-t span{display:inline-block;opacity:0;transform:translateY(18px);background:linear-gradient(180deg,#2f7d4f,#1f4a35);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ldt .7s cubic-bezier(.2,.9,.3,1) forwards}
#ld .ld-t span:nth-child(1){animation-delay:.6s}#ld .ld-t span:nth-child(2){animation-delay:.68s}#ld .ld-t span:nth-child(3){animation-delay:.76s}
#ld .ld-t span:nth-child(4){animation-delay:.84s}#ld .ld-t span:nth-child(5){animation-delay:.92s}#ld .ld-t span:nth-child(6){animation-delay:1s}
@keyframes ldt{to{opacity:1;transform:none}}
#ld .ld-s{margin:0;font-size:12px;letter-spacing:.7em;padding-left:.7em;color:#4f8068;opacity:0;animation:ldt .8s 1.5s ease forwards}
#ld .ld-bar{width:clamp(140px,22vh,220px);height:4px;border-radius:99px;margin-top:10px;overflow:hidden;background:linear-gradient(90deg,#ffffffaa,#ffffffaa);box-shadow:inset 0 0 0 1px #bfe8d0}
#ld .ld-bar b{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#9be5bf,#46b074,#f29bbd);transform:translateX(-100%);animation:ldb 2.1s .1s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes ldb{to{transform:none}}
</style>
